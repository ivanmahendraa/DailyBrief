<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- Daily Horizon Symbol based on Reference Design -->
  <g fill="none" stroke="#325163" stroke-linecap="round" stroke-linejoin="round">
    <!-- Inner Arc -->
    <path d="M 70.0 68.2 A 17.5 17.5 0 1 1 70.0 51.8" stroke-width="3.6" />
    <!-- Middle Arc -->
    <path d="M 75.3 81.6 A 30 30 0 1 1 75.3 38.4" stroke-width="3.8" />
    <!-- Outer Arc -->
    <path d="M 88.0 86.2 A 42.5 42.5 0 1 1 88.0 33.8" stroke-width="3.8" />

