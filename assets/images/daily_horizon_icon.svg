    <line x1="78.5" y1="52.0" x2="78.5" y2="68.0" stroke-width="3.6" />
    <line x1="84.5" y1="47.0" x2="84.5" y2="73.0" stroke-width="3.6" />
    <line x1="90.5" y1="41.5" x2="90.5" y2="78.5" stroke-width="3.6" />
    <line x1="96.5" y1="47.0" x2="96.5" y2="73.0" stroke-width="3.6" />
    <line x1="102.5" y1="52.0" x2="102.5" y2="68.0" stroke-width="3.6" />
  </g>
  <!-- Sound Wave Flares -->
  <g fill="#325163">
    <path d="M 71.0 60.0 Q 75.0 60.0 77.0 56.5 L 77.0 63.5 Q 75.0 60.0 71.0 60.0 Z" />
    <path d="M 104.0 56.5 Q 106.0 60.0 110.0 60.0 Q 106.0 60.0 104.0 63.5 Z" />
